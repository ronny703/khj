<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>캐릭터 휴대폰</title>
<style>
:root{--bg:#dcdce2;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141416}}
:root[data-theme=dark]{--bg:#141416}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overscroll-behavior:none}
#ph{position:relative;width:100%;max-width:430px;height:100%;margin:0 auto;overflow:hidden;background:#000;color:#fff}
#sb{position:absolute;top:0;left:0;right:0;z-index:20;height:calc(env(safe-area-inset-top,0px) + 44px);padding:calc(env(safe-area-inset-top,0px) + 14px) 28px 0;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;pointer-events:none}
#sb span{display:flex;gap:6px;align-items:center}
.bt{background:#fff;color:#000;border-radius:6px;padding:0 5px;font-size:12px;font-weight:700}
#ph[data-t=d] #sb{color:#000}#ph[data-t=d] .bt{background:#000;color:#fff}
#hb{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:#fff;z-index:20}
#ph[data-t=d] #hb{background:#000}#ph[data-s=lock] #hb{display:block}
#hb:before{content:"";position:absolute;inset:-14px -20px}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 44px);overflow:hidden}
.scr.on{display:flex}
.body{flex:1;overflow-y:auto;padding-bottom:40px}
.w1{background:var(--wall,linear-gradient(160deg,#3a2b4d,#b0566e 55%,#1f4458)) center/cover}
#lock{align-items:center;text-align:center}
#lock .d{margin-top:40px;font-size:20px;font-weight:600}
#lock .t{font-size:112px;font-weight:700;line-height:1.05;letter-spacing:-2px;color:#fdeef2}
.lw{align-self:flex-start;margin:34px 30px;text-align:left;font-size:15px;line-height:1.4}
.lw b{font-size:20px}.lw small{opacity:.7;display:block}
.lb{margin-top:auto;display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 40px 44px;font-size:17px}
.lb i{width:52px;height:52px;border-radius:50%;background:rgba(20,20,24,.6);backdrop-filter:blur(14px);display:grid;place-items:center}
.lb u{text-decoration:none;display:flex;gap:8px;align-items:center}.lb u:before{content:"";width:14px;height:14px;border-radius:50%;background:#fff}
#home{padding:0 20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;margin-top:6px}
.wd{grid-column:1/3;grid-row:1/3;background:#1b1f2e;border-radius:28px;padding:16px;text-align:left;font-size:14px;line-height:1.35}
.wd b{font-size:50px;font-weight:300;display:block;margin:2px 0 6px}
.ap{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.ic{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35)}
.ic i{font-style:normal;color:#333;font-size:10px;font-weight:600;display:block;line-height:1;text-shadow:none}
.ic em{font-style:normal;color:#111;font-size:30px;font-weight:300;line-height:1.05;text-shadow:none}
.bg{position:absolute;top:-8px;left:50%;margin-left:6px;background:#ff3b30;border-radius:14px;min-width:24px;padding:2px 8px;font-size:14px;font-weight:600;text-align:center;text-shadow:none}
.sp{margin:auto auto 14px;background:rgba(255,255,255,.28);backdrop-filter:blur(14px);border-radius:20px;padding:6px 20px;font-size:13px}
.dock{margin:0 -8px 26px;padding:14px;border-radius:32px;background:rgba(255,255,255,.25);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(4,1fr)}
.dock .ap span{display:none}
.lt{background:#fff;color:#111}
.hd{padding:6px 18px 8px;font-size:30px;font-weight:800}
.hd small{display:block;font-size:13px;font-weight:400;color:#8a8a8e}
.mh{display:flex;justify-content:space-between;align-items:center;padding:6px 18px 0;color:#0a7aff;font-size:17px}
.mt2{font-size:36px;font-weight:800;color:#000;padding:14px 18px 8px}
.mr{position:relative;display:flex;gap:14px;padding:0 0 0 18px}
.ud{position:absolute;left:5px;top:42px;width:11px;height:11px;border-radius:50%;background:#0a7aff}
.mr .av2{margin-top:12px}
.mx{flex:1;min-width:0;border-top:1px solid #dcdce0;padding:12px 14px 12px 0}
.l1{display:flex;justify-content:space-between;font-size:17px;font-weight:700}
.l1 span{font-size:15px;color:#8e8e93;font-weight:400}
.mx p{font-size:16px;color:#8e8e93;margin-top:2px;line-height:1.35}
.av2{width:62px;height:62px;border-radius:50%;background:linear-gradient(#aab0bd,#868c9c);display:grid;place-items:center;flex:none}
.av2 svg{width:42px;height:42px;margin-top:10px}
.row{display:flex;gap:12px;padding:10px 18px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;background:#d8d8de;display:grid;place-items:center;font-weight:700;color:#555;flex:none}
.rt{flex:1;min-width:0}.rt b{font-size:15.5px}
.rt p{font-size:13.5px;color:#8a8a8e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tm{font-size:11.5px;color:#aaa;text-align:right}
.bd{display:inline-block;margin-top:4px;background:#ff3b30;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700}
#chat .top{display:flex;align-items:center;justify-content:center;position:relative;padding:8px 14px 12px;font-weight:600;font-size:18px}
#chat .top i{position:absolute;left:14px;font-style:normal;font-size:32px;line-height:1}
#chat.k{background:#b2c7da;color:#111}#chat.m{background:#fff;color:#111}#chat.p{background:#e9e5f3;color:#111}
.p .top{background:#fff}.sub{background:#fff;text-align:center;font-weight:700;font-size:15px;padding:6px;border-radius:0 0 14px 14px}
#chat .ms{flex:1;overflow-y:auto;padding:12px 14px 12px;display:flex;flex-direction:column;gap:8px}
.in{display:flex;gap:8px;padding:8px 12px 30px;background:rgba(255,255,255,.7)}
.in input{flex:1;border:1px solid #ccc;border-radius:20px;padding:9px 14px;font-size:16px;outline:0;background:#fff;color:#111}
.in b{width:36px;height:36px;border-radius:50%;background:#0a84ff;color:#fff;display:grid;place-items:center;font-size:20px}
.k .in b{background:#fee500;color:#111}.p .in b{background:#a58cf0}
.b{max-width:72%;padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.4;word-break:keep-all}
.k .b.o{align-self:flex-start;background:#fff;border-radius:4px 18px 18px 18px}
.k .b.me{align-self:flex-end;background:#fee500;border-radius:18px 4px 18px 18px}
.m .b.o{align-self:flex-start;background:#e9e9eb}
.m .b.me{align-self:flex-end;background:#0a84ff;color:#fff}
.p .b.o{background:#fff;margin-top:3px}.p .b.me{align-self:flex-end;background:#a58cf0;color:#fff}
.ar{display:flex;gap:8px;max-width:85%}.ar .b{display:inline-block;max-width:100%}
.pa{background:linear-gradient(135deg,#ff8fc0,#6a5acd);color:#fff;width:40px;height:40px}
.ab{background:#7c5ce6;color:#fff;border-radius:8px;padding:1px 6px;font-size:10px;font-weight:700}
.top2{display:flex;justify-content:space-between;align-items:flex-start;padding:0 14px}
.top2 span{display:inline-block;background:#e8e8ed;border-radius:22px;padding:10px 20px;font-size:17px;font-weight:600;margin-left:8px}
.gl{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.gl div{aspect-ratio:1;display:grid;place-items:center;font-size:12px;color:rgba(255,255,255,.85);overflow:hidden}
.seg{position:absolute;bottom:34px;left:14px;right:14px;display:flex;gap:10px;z-index:5}
.seg span{background:rgba(235,235,240,.92);backdrop-filter:blur(14px);border-radius:30px;padding:14px;text-align:center;color:#111;font-size:18px;font-weight:600}
.seg .f{flex:1;display:flex;justify-content:space-around}.seg .on2{background:#d0d0d6;border-radius:24px;padding:0 18px}
.rc.red b{color:#ff3b30}.rc small{color:#8a8a8e;font-size:12.5px}
#mus{background:linear-gradient(180deg,#5a1f3a,#14080e);align-items:center}
.art{margin-top:24px;width:78%;aspect-ratio:1;border-radius:14px;background:linear-gradient(135deg,#ff6a88,#6a5acd);box-shadow:0 20px 50px rgba(0,0,0,.5);display:grid;place-items:center;font-size:64px}
.mt{width:78%;margin-top:26px}.mt b{font-size:20px}.mt p{color:#e8a9c0;margin-top:3px}
.pb{height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin-top:20px}
.pb i{display:block;width:38%;height:100%;border-radius:2px;background:#fff}
.ct{display:flex;gap:44px;font-size:34px;margin-top:26px}
</style></head><body>
<div id="ph" data-t="l" data-s="lock">
<div id="sb"><b id="sl"></b><span><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect y="8" width="3" height="4" rx=".6"/><rect x="5" y="5.5" width="3" height="6.5" rx=".6"/><rect x="10" y="3" width="3" height="9" rx=".6"/><rect x="15" width="3" height="12" rx=".6"/></svg><svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.2a10 10 0 0114 0M4 7a6.5 6.5 0 019 0"/><circle cx="8.5" cy="10" r="1" fill="currentColor"/></svg><b class="bt" id="bt"></b></span></div>
<div class="scr w1 on" id="lock" data-t="l" onclick="go('home')"><div class="d" id="dt"></div><div class="t" id="tt"></div><div class="lw" id="lw"></div><div class="lb"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M8 2h8v4l-2 3v13h-4V9L8 6z"/></svg></i><u id="al"></u><i><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="2.5" y="6.5" width="19" height="14" rx="3"/><circle cx="12" cy="13.5" r="4"/></svg></i></div></div>
<div class="scr w1" id="home" data-t="l"><div class="grid" id="hg"></div><div class="sp">🔍 검색</div><div class="dock" id="dk"></div></div>
<div class="scr lt" id="kk" data-t="d"></div>
<div class="scr lt" id="msg" data-t="d"></div>
<div class="scr" id="chat" data-t="d"></div>
<div class="scr lt" id="gal" data-t="d"><div class="top2"><div class="hd" style="padding:0">보관함<small id="gc"></small></div><div><span>🔍</span><span id="gn"></span></div></div><div class="body" style="margin-top:10px"><div class="gl" id="gl"></div></div><div class="seg"><span>⇅</span><span class="f"><b>연</b><b>월</b><b class="on2">전체</b></span><span onclick="go('home')">✕</span></div></div>
<div class="scr lt" id="tel" data-t="d"><div class="hd">최근 기록</div><div class="body" id="tb"></div></div>
<div class="scr" id="mus" data-t="l"><div class="art">🎵</div><div class="mt"><b id="mn"></b><p id="ma"></p><div class="pb"><i></i></div></div><div class="ct"><span>⏮</span><span>⏸</span><span>⏭</span></div></div>
<div id="hb" onclick="go('home')"></div>
</div>
<script>
/* ▼ 여기만 바꾸면 돼요 ▼ */
const C={
 me:"승희", wall:"", /* 배경사진 경로 예: "img/wall.jpg" */
 city:"서울특별시", temp:"14°", wx:"내일의 최고 기온은 21°로, 더 높은 기온이 예상됨", alerts:20,
 badge:{tel:24,msg:789,mail:"16,683",as:121,set:1},
 kk:[
  {n:"엄마",t:"오후 3:12",c:2,m:[[0,"밥 먹었어?"],[1,"응 먹었어"],[0,"일찍 들어와"]]},
  {n:"친구",t:"어제",c:0,m:[[0,"내일 뭐해?"],[1,"아직 몰라"]]}],
 msg:[
  {n:"정이안",t:"오후 6:30",c:1,m:[[0,"담에는 봐줄게"]]},
  {n:"매니저",t:"어제",c:0,m:[[0,"오늘 스케줄 확인해줘"],[1,"확인했어요"]]}],
 pop:{n:"BLAKE",m:[[0,"오늘 밤하늘 유난히 맑다~! 내일이면 곧 만나네요"],[1,"빨리 보고싶어요~"],[0,"나도 빨리 보고싶다~"]]},
 re:[["보고싶","나도 보고 싶어"],["사랑","나도 사랑해 ♥"],["뭐해","그냥 쉬고 있어. 너는?"],["밥","방금 먹었어. 너는 먹었어?"],["안녕","안녕! 오늘 어때?"]], /* [키워드, 답장] */
 def:["응, 그랬구나","그래서?","ㅎㅎ 알겠어","좀 더 얘기해 줘"], /* 키워드가 없을 때 랜덤 답장 */
 tel:[["엄마","수신 · 3분","오후 3:10"],["친구","부재중","어제"],["매니저","발신 · 1분","어제"]],
 mus:["노래 제목","가수 이름"], gal:15,
 photos:[] /* 사진 경로 예: ["img/1.jpg","img/2.jpg"] */
};
/* ▲ 여기까지 ▲ */
const $=s=>document.getElementById(s),ph=$('ph');let clk='',cur,mode;
if(C.wall)document.documentElement.style.setProperty('--wall',`url("${C.wall}")`);
function go(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==id));ph.dataset.t=$(id).dataset.t;ph.dataset.s=id;$('sl').textContent=id=='lock'?'SKT':clk}
const S=(b,g)=>`<div class="ic" style="background:${b}"><svg viewBox="0 0 24 24" width="34" height="34">${g}</svg></div>`;
const G='linear-gradient(#6fe27f,#2fbf4a)',d0=new Date();
const pet=[...Array(8)].map((_,i)=>`<ellipse cx="12" cy="7" rx="3" ry="4.6" fill="hsl(${i*45+5} 85% 58%)" opacity=".7" transform="rotate(${i*45} 12 12)"/>`).join('');
const IC={
 fc:S(G,'<rect x="3" y="7" width="12" height="10" rx="3" fill="#fff"/><path d="M16 11l5-3v8l-5-3z" fill="#fff"/>'),
 cal:`<div class="ic" style="background:#fff;align-content:center"><i>${'일월화수목금토'[d0.getDay()]}요일</i><em>${d0.getDate()}</em></div>`,
 gal:S('#fff',pet),
 cam:S('linear-gradient(#d9d9de,#9d9da3)','<rect x="2.5" y="6.5" width="19" height="13" rx="3" fill="#222"/><circle cx="12" cy="13" r="4" fill="none" stroke="#ddd" stroke-width="1.6"/>'),
 mail:S('linear-gradient(#5ab6ff,#1a6df0)','<rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M3.5 7l8.5 6 8.5-6" fill="none" stroke="#fff" stroke-width="1.8"/>'),
 memo:'<div class="ic" style="background:linear-gradient(#f7d54a 24%,#fff 24%)"></div>',
 clk:S('#111','<circle cx="12" cy="12" r="9.5" fill="#fff"/><path d="M12 5v7l4 2" stroke="#111" stroke-width="1.6" fill="none"/>'),
 as:S('linear-gradient(#35b4ff,#1a5be0)','<path d="M8 18l7-12M9 6l8 12M6 15h12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>'),
 wx:S('linear-gradient(#3b7be0,#79b8f5)','<circle cx="16" cy="9" r="4" fill="#ffd44a"/><ellipse cx="10" cy="15" rx="6.5" ry="4" fill="#fff"/>'),
 set:S('linear-gradient(#aaaab1,#6d6d73)','<circle cx="12" cy="12" r="7.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-dasharray="2.6 1.7"/><circle cx="12" cy="12" r="5" fill="none" stroke="#fff" stroke-width="2"/>'),
 kk:S('#fee500','<ellipse cx="12" cy="11" rx="9" ry="7.2" fill="#3b1e1e"/><path d="M6 18l1-3.5 3 2z" fill="#3b1e1e"/>'),
 pop:S('linear-gradient(#b69cff,#7c5ce6)','<path d="M12 20s-7-4.6-7-10a4 4 0 017-2.5A4 4 0 0119 10c0 5.4-7 10-7 10z" fill="#fff"/>'),
 tel:S(G,'<path fill="#fff" d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/>'),
 saf:S('#fff','<circle cx="12" cy="12" r="9.5" fill="#3a9bf0"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="#ff3b30"/>'),
 msg:S(G,'<ellipse cx="12" cy="11" rx="9" ry="7.3" fill="#fff"/><path d="M5 20c2-.8 3-2 3.4-3.6l2.4 1z" fill="#fff"/>'),
 mus:S('linear-gradient(#ff6b7d,#e8213f)','<path d="M9 17V6l10-2v11" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="7" cy="17.5" r="2.8" fill="#fff"/><circle cx="17" cy="15.5" r="2.8" fill="#fff"/>')
};
const ap=(k,l,a)=>`<div class="ap" ${a?`onclick="${a}"`:''}>${IC[k]}${C.badge[k]?`<b class="bg">${C.badge[k]}</b>`:''}<span>${l}</span></div>`;
$('hg').innerHTML=`<div class="wd"><span>${C.city} ➤</span><b>${C.temp}</b>${C.wx}</div>`+ap('fc','FaceTime')+ap('cal','캘린더')+ap('gal','사진',"go('gal')")+ap('cam','카메라')+ap('mail','Mail')+ap('memo','메모')+ap('clk','시계')+ap('as','App Store')+ap('wx','날씨')+ap('set','설정')+ap('kk','카카오톡',"go('kk')")+ap('pop','팝팝',"room('pop',-1)");
$('dk').innerHTML=ap('tel','전화',"go('tel')")+ap('saf','Safari')+ap('msg','메시지',"go('msg')")+ap('mus','Music',"go('mus')");
$('lw').innerHTML=`☁ <b>${C.temp}</b><br>흐림<small>최고:18° 최저:11°</small>`;$('al').textContent=C.alerts+'개의 알림';
const sil='<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2" fill="#fff"/><path d="M3.5 22c0-5.5 4-8 8.5-8s8.5 2.5 8.5 8z" fill="#fff"/></svg>';
$('kk').innerHTML=`<div class="hd">카카오톡</div><div class="body">`+C.kk.map((c,i)=>`<div class="row" onclick="room('kk',${i})"><div class="av">${c.n[0]}</div><div class="rt"><b>${c.n}</b><p>${c.m[c.m.length-1][1]}</p></div><div class="tm">${c.t}${c.c?`<br><span class="bd">${c.c}</span>`:''}</div></div>`).join('')+`</div>`;
$('msg').innerHTML=`<div class="mh"><span>편집</span><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0a7aff" stroke-width="1.8"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M19 3l2 2-9 9-3 1 1-3z"/></svg></div><div class="mt2">메시지</div><div class="body">`+C.msg.map((c,i)=>`<div class="mr" onclick="room('msg',${i})">${c.c?'<i class="ud"></i>':''}<div class="av2">${sil}</div><div class="mx"><div class="l1"><b>${c.n}</b><span>${c.t} ›</span></div><p>${c.m[c.m.length-1][1]}</p></div></div>`).join('')+`</div>`;
const bub=x=>!x[0]&&mode=='p'?`<div class="ar"><div class="av pa">${cur.n[0]}</div><div><span class="ab">ARTIST</span> <b>${cur.n}</b><div class="b o">${x[1]}</div></div></div>`:`<div class="b ${x[0]?'me':'o'}">${x[1]}</div>`;
function room(k,i){cur=i<0?C[k]:C[k][i];mode=k=='kk'?'k':k=='pop'?'p':'m';const e=$('chat');e.className='scr on '+mode;e.dataset.t='d';e.innerHTML=`<div class="top"><i onclick="go('${k=='pop'?'home':k}')">‹</i>${cur.n}</div>${mode=='p'?'<div class="sub">bubble 💜 + 100</div>':''}<div class="ms" id="ms">${cur.m.map(bub).join('')}</div><div class="in"><input id="ti" placeholder="메시지 입력" onkeydown="event.key=='Enter'&&send()"><b onclick="send()">↑</b></div>`;go('chat');$('ms').scrollTop=1e5}
function put(x){cur.m.push(x);$('ms').insertAdjacentHTML('beforeend',bub(x));$('ms').scrollTop=1e5}
function send(){const v=$('ti').value.trim();if(!v)return;$('ti').value='';put([1,v]);setTimeout(()=>put([0,(C.re.find(a=>v.includes(a[0]))||[0,C.def[Math.random()*C.def.length|0]])[1]]),900)}
const N=C.photos.length||C.gal;$('gc').textContent='2026년 9월 30일';$('gn').textContent=C.me;
$('gl').innerHTML=Array.from({length:N},(_,i)=>C.photos[i]?`<div><img src="${C.photos[i]}" style="width:100%;height:100%;object-fit:cover"></div>`:`<div style="background:linear-gradient(135deg,hsl(${i*37%360} 25% 35%),hsl(${(i*37+50)%360} 30% 22%))">${i+1}</div>`).join('');
$('tb').innerHTML=C.tel.map(r=>`<div class="row rc ${r[1]=='부재중'?'red':''}"><div class="rt"><b>${r[0]}</b><br><small>${r[1]}</small></div><div class="tm">${r[2]}</div></div>`).join('');
$('mn').textContent=C.mus[0];$('ma').textContent=C.mus[1];$('bt').textContent='85';
function tick(){const d=new Date(),h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');clk=h+':'+m;$('tt').textContent=clk;$('dt').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+'일월화수목금토'[d.getDay()]+'요일';if(ph.dataset.s!='lock')$('sl').textContent=clk}
tick();$('sl').textContent='SKT';setInterval(tick,20000);
